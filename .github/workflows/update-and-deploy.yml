name: update-and-deploy-draws

on:
  schedule:
    # 抽せん日の21:30 JST
    - cron: "30 12 * * 1,2,4,5"
    # 同日23:17 JSTの再試行（GitHub側で予約実行が欠落する場合に備える）
    - cron: "17 14 * * 1,2,4,5"
    # 翌朝09:30 JSTの再試行
    - cron: "30 0 * * 2,3,5,6"
  workflow_dispatch:
    inputs:
      games:
        description: "更新するゲーム"
        required: true
        type: choice
        options: [all, miniloto, loto6, loto7]
        default: all

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: enishi-draw-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Test parser and seed data
        run: python -m pytest -q

      - id: update
        name: Fetch and validate official results
        env:
          TARGET_GAMES: ${{ github.event.inputs.games || 'all' }}
          MONTHS_BACK: "2"
        run: xvfb-run -a python scripts/update_draws.py

      - if: steps.update.outputs.changed == 'true'
        name: Commit verified results
        run: |
          git config user.name "enishi-draw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/draws.json
          git commit -m "data: update verified draw results"
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v5
